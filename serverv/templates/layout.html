<!-- Load static files and timezone -->

<html lang="en">
    <head>
        <!-- Set the title of the page -->
        <title>{% block title %}⭐Monitoring⭐{% endblock %}</title>
        
        <!-- Load Bootstrap CSS -->
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

        <!-- Load custom CSS -->
        <link href="{% static 'network/styles.css' %}" rel="stylesheet">

        <!-- Load Font Awesome for icons -->

        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/date-fns@3.2.0/index.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="https://d3js.org/d3.v5.min.js"></script>

        <!-- Include jQuery and jQuery UI libraries -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.0/themes/base/jquery-ui.css">
        <script src="https://code.jquery.com/ui/1.13.0/jquery-ui.js"></script>

        <!-- Load older version of Font Awesome for compatibility -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Start of the body -->
    <body>
        <!-- Navigation bar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <!-- Logo -->
            <img src="/static/lamp-on.png" alt="Italian Trulli">

            <!-- Navigation items -->
            <div>
              <ul class="navbar-nav mr-auto">
                <!-- Depending on whether the user is authenticated, different navigation items are shown -->
                {% if user.is_authenticated %}
                    <!-- If the user is authenticated, show Log Out, Welcome, Get Status, and Cart links -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'logout' %}"><strong>Log Out</strong></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'profile' user_id=user.id %}"><strong>Welcome {{ user }}</strong></a>
                    </li>
                    <li class="nav-item">
                         <a id="getstatus" class="nav-link" href="{% url 'index' %}"><strong>Index</strong></a>
                    </li>
                    <li class="nav-item">
                         <a class="nav-link" href="{% url 'chart' user_id=user.id %}"><strong>Chart {{ user }}</strong></a>
                    </li>
                {% else %}
                    <!-- If the user is not authenticated, show Log In and Register links -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'login' %}">Log In</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'register' %}">Register</a>
                    </li>
                {% endif %}
              </ul>
            </div>
        </nav>

<!-- Main body content -->
<div class="body" style="height: 100%;">
<!-- This block is replaced by the content of each individual page -->

<!-- Script to handle the click event of the "getstatus" element -->
<script>
$("#getstatus").click(function() {
    $.ajax({
        url: '/sensor/',  // Django view function url
        type: 'get',  // or 'post'
        headers: {
            "X-CSRFToken": getCookie("csrftoken")
        },
        success: function(response) {
            console.log(response.Ultrasonic);
            console.log(response.value);
        }
    });
});
</script>

<!-- Function to get a cookie value -->
<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>

<!-- Setup AJAX with CSRF token -->
<script>
$.ajaxSetup({
    headers: { "X-CSRFToken": getCookie("csrftoken") }
});
</script>

<!-- Body content block -->
{% block body %}
{% endblock %}
</div>
</body>
</html>
